<div class="container grid-page-shell">

	<!-- ============================================
		 Page header: caption + record toggle + New Record
		 ============================================ -->
	<div class="page-header-bar">

		<h1 class="page-caption">TblUserDetailsList</h1>

		<div class="page-header-center">
			<button type="submit" class="btn-app btn-toggle" [disabled]="actionType === 'Load All'"
				(click)="OnFormSubmit('Load All')"
				[attr.title]="actionType !== 'Load All' ? 'Loading All Records' : 'All Records'">
				<i class="bi bi-list-ul"></i>
				All Records
			</button>

			<button type="submit" class="btn-app btn-toggle" [disabled]="actionType === 'Active Only'"
				(click)="OnFormSubmit('Active Only')"
				[attr.title]="actionType !== 'Active Only' ? 'Loading Active Records' : 'Active Records'">
				<i class="bi bi-check-circle"></i>
				Active Records
			</button>
		</div>

		<div class="page-header-right">
			<a [routerLink]="['add']" class="btn-app btn-new">
				<i class="bi bi-plus-lg"></i>
				New Record
			</a>
		</div>

	</div>

	<div class="page-card">

		<div class="page-header-bar-secondary">

			<div class="page-header-left">
				<button type="button" class="btn-app btn-outline">
					<i class="bi bi-funnel"></i>
					Filter
				</button>

				<button type="button" class="btn-app btn-outline">
					<i class="bi bi-download"></i>
					Export CSV
				</button>
			</div>

			<div class="page-header-right">
				<ng-container *ngIf="tblUserDetail$ | async as tbluserdetails">
					<span class="pagination-info">
						Showing {{ tbluserdetails.length }} of {{ tbluserdetails.length }} Records
					</span>
				</ng-container>

				<button type="button" class="pager-btn" disabled>
					<i class="bi bi-chevron-left"></i>
				</button>
				<button type="button" class="pager-btn" disabled>
					<i class="bi bi-chevron-right"></i>
				</button>
			</div>

		</div>

		<ng-container *ngIf="tblUserDetail$ | async as tbluserdetails">

			<table class="data-table">
				<thead>
					<tr>
						<!-- <th>Id</th>
						<th>F K User</th> -->
						<th>F K Menu Master</th>
						<th>Condition</th>
						<!-- <th>F K Menu Category</th>
						<th>F K Role</th>
						<th>Role Name</th>
						<th>Role</th>
						<th>Menu Role Code</th> -->
						<th>Actions</th>
					</tr>
				</thead>

				<tbody>
					<tr *ngFor="let tbluserdetail of tbluserdetails">
						<!-- <td class="cell-code">{{tbluserdetail.fldId}}</td> -->
						<!-- <td>{{tbluserdetail.fldFKUser}}</td> -->
						<td>{{tbluserdetail.fldFKMenuMaster}}</td>
						<td class="cell-primary">{{tbluserdetail.fldCondition}}</td>
						<!-- <td>{{tbluserdetail.fldFKMenuCategory}}</td>
						<td>{{tbluserdetail.fldFKRole}}</td>
						<td>{{tbluserdetail.fldRoleName}}</td>
						<td>{{tbluserdetail.fldRole}}</td>
						<td class="cell-mono">{{tbluserdetail.fldMenuRoleCode}}</td> -->
						<td>
							<div class="row-actions">
								<a 
									class="icon-btn edit" 
									title="Edit" 
									[routerLink]="['/mastertables/tblUserDetail',
										tbluserdetail.fldFKUser, 'Edit',
										tbluserdetail.fldId ]" 
									[queryParams]="{ action: 'Edit' }">
									<i class="bi bi-pencil-square"></i>
								</a>

								<a class="icon-btn delete" title="Delete"
									[routerLink]="['/mastertables/tblUserDetail',
										tbluserdetail.fldFKUser, 'Edit',
										tbluserdetail.fldId ]"
									[queryParams]="{ action: 'Delete' }">
									<i class="bi bi-trash3"></i>
								</a>
							</div>
						</td>
					</tr>
				</tbody>

			</table>

			<p class="grid-footnote" *ngIf="tbluserdetails.length === 0">
				No records found.
			</p>

		</ng-container>

	</div>

</div>
