<div class="container grid-page-shell">

	<!-- ============================================
		 Page header: caption + record toggle + New Record
		 ============================================ -->
	<div class="page-header-bar">

		<h1 class="page-caption">TblAreaMastersList</h1>

		<div class="page-header-center">
			<button type="submit" class="btn-app btn-toggle" [disabled]="actionType === 'Load All'"
				(click)="OnFormSubmit('Load All')"
				[attr.title]="actionType !== 'Load All' ? 'Loading All Records' : 'All Records'">
				<i class="bi bi-list-ul"></i>
				All Records
			</button>

			<button type="submit" class="btn-app btn-toggle" [disabled]="actionType === 'Active Only'"
				(click)="OnFormSubmit('Active Only')"
				[attr.title]="actionType !== 'Active Only' ? 'Loading Active Records' : 'Active Records'">
				<i class="bi bi-check-circle"></i>
				Active Records
			</button>
		</div>

		<div class="page-header-right">
			<a [routerLink]="['add']" class="btn-app btn-new">
				<i class="bi bi-plus-lg"></i>
				New Record
			</a>
		</div>

	</div>

	<div class="page-card">

		<div class="page-header-bar-secondary">

			<div class="page-header-left">
				<button type="button" class="btn-app btn-outline">
					<i class="bi bi-funnel"></i>
					Filter
				</button>

				<button type="button" class="btn-app btn-outline">
					<i class="bi bi-download"></i>
					Export CSV
				</button>
			</div>

			<div class="page-header-right">
				<ng-container *ngIf="tblAreaMaster$ | async as tblareamasters">
					<span class="pagination-info">
						Showing {{ tblareamasters.length }} of {{ tblareamasters.length }} Records
					</span>
				</ng-container>

				<button type="button" class="pager-btn" disabled>
					<i class="bi bi-chevron-left"></i>
				</button>
				<button type="button" class="pager-btn" disabled>
					<i class="bi bi-chevron-right"></i>
				</button>
			</div>

		</div>

		<ng-container *ngIf="tblAreaMaster$ | async as tblareamasters">

			<table class="data-table">
				<thead>
					<tr>
						<!-- <th>Id</th>
						<th>F K State</th> -->
						<th>State</th>
						<!-- <th>F K City</th> -->
						<th>City</th>
						<!-- <th>F K Area</th> -->
						<th>Area</th>
						<!-- <th>F K Pincode</th> -->
						 <th>Pincode</th>
						<!-- <th>State Code</th>
						<th>State Short Code</th> -->
						<th>Actions</th>
					</tr>
				</thead>

				<tbody>
					<tr *ngFor="let tblareamaster of tblareamasters">
						<!-- <td class="cell-code">{{tblareamaster.fldId}}</td> -->
						<!-- <td>{{tblareamaster.fldFKState}}</td> -->
						<td class="cell-primary">{{tblareamaster.fldState}}</td>
						<!-- <td>{{tblareamaster.fldFKCity}}</td> -->
						<td>{{tblareamaster.fldCity}}</td>
						<!-- <td>{{tblareamaster.fldFKArea}}</td> -->
						<td>{{tblareamaster.fldArea}}</td>
						<!-- <td>{{tblareamaster.fldFKPincode}}</td> -->
						 <td>{{tblareamaster.fldPincode}}</td>
						<!-- <td>{{tblareamaster.fldStateCode}}</td> -->
						<!-- <td class="cell-mono">{{tblareamaster.fldStateShortCode}}</td> -->
						<td>
							<div class="row-actions">
								<a class="icon-btn edit" title="Edit"
									[routerLink]="['/mastertables/tblAreaMaster/Edit', tblareamaster.fldId]"
									[queryParams]="{ action: 'Edit' }">
									<i class="bi bi-pencil-square"></i>
								</a>
								<a class="icon-btn delete" title="Delete"
									[routerLink]="['/mastertables/tblAreaMaster/Edit', tblareamaster.fldId]"
									[queryParams]="{ action: 'Delete' }">
									<i class="bi bi-trash3"></i>
								</a>
							</div>
						</td>
					</tr>
				</tbody>

			</table>

			<p class="grid-footnote" *ngIf="tblareamasters.length === 0">
				No records found.
			</p>

		</ng-container>

	</div>

</div>
