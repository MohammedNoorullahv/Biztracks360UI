<div class="container grid-page-shell">

	<!-- ============================================
		 Section 1: Caption
		 ============================================ -->
	<div class="page-header-bar-simple">
		<h1 class="page-caption">{{ actionType }} Property Master</h1>
	</div>

	<ng-container *ngIf="tblPropertyMaster; else notFound">

		<form #form="ngForm" (ngSubmit)="OnFormSubmit(form)" novalidate>

			<!-- ============================================
				 Section 2: Input fields
				 ============================================ -->
			<div class="page-card">

				<div class="d-flex flex-row form-row">
					<div class="col-1 field-group">
						<label class="form-label" for="fldSlNo">Sl No</label>
						<input type="number" id="fldSlNo" class="form-control" name="fldSlNo"
							[(ngModel)]="tblPropertyMaster.fldSlNo" step="1" min="1" required>

						<div class="text-danger" *ngIf="form.controls['fldSlNo']?.touched &&
						form.controls['fldSlNo']?.invalid">

							Sl No must be greater than zero.

						</div>
					</div>
					<div class="col-4 field-group">
						<label class="form-label" for="fldDescription">Description</label>
						<input type="text" id="fldDescription" class="form-control" name="fldDescription"
							[(ngModel)]="tblPropertyMaster.fldDescription" maxlength="30" required>

						<div class="text-danger" *ngIf="form.controls['fldDescription']?.touched &&
							form.controls['fldDescription']?.invalid">

							Description is required.

						</div>
					</div>

					<div class="col-3 field-group">
						<label class="form-label" for="fldShortName">Short Name</label>
						<input type="text" id="fldShortName" class="form-control" name="fldShortName"
							[(ngModel)]="tblPropertyMaster.fldShortName" maxlength="10" required>

						<div class="text-danger" *ngIf="form.controls['fldShortName']?.touched &&
							form.controls['fldShortName']?.invalid">

							Short Name is required.

						</div>
					</div>
					<div class="col-2 field-group field-group-switch">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" id="fldIsEditAllowed" #fldIsEditAllowed
								[checked]="tblPropertyMaster.fldIsEditAllowed"
								(change)="tblPropertyMaster.fldIsEditAllowed = fldIsEditAllowed.checked">
							<label class="form-check-label" for="fldIsEditAllowed">Is Edit Allowed</label>
						</div>

						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" id="fldIsDeleteAllowed" #fldIsDeleteAllowed
								[checked]="tblPropertyMaster.fldIsDeleteAllowed"
								(change)="tblPropertyMaster.fldIsDeleteAllowed = fldIsDeleteAllowed.checked">
							<label class="form-check-label" for="fldIsDeleteAllowed">Is Delete Allowed</label>
						</div>
					</div>
				</div>

				<input id="fldId" name="fldId" [(ngModel)]="tblPropertyMaster.fldId" hidden>
				<input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblPropertyMaster.fldIsActive" hidden>
				<input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblPropertyMaster.fldCreatedBy" hidden>
				<input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblPropertyMaster.fldCreatedDt" hidden>

			</div>

			<!-- ============================================
				 Section 3: Command buttons
				 ============================================ -->
			<div class="page-actions-bar">
				<button type="submit" (click)="submitAction = 'Edit'" class="btn-app btn-save"
					[disabled]="actionType !== 'Edit'"
					[attr.title]="actionType !== 'Edit' ? 'Only editable records can be saved' : 'Save changes'">
					<i class="bi bi-floppy"></i>
					Save
				</button>
				<button type="submit" (click)="submitAction = 'Delete'" class="btn-app btn-delete"
					[disabled]="actionType !== 'Delete'"
					[attr.title]="actionType !== 'Delete' ? 'Only deletable records can be removed' : 'Delete record'">
					<i class="bi bi-trash3"></i>
					Delete
				</button>
				<button type="button" (click)="backToHome()" class="btn-app btn-dark">
					<i class="bi bi-arrow-left"></i>
					Back
				</button>
			</div>

		</form>

	</ng-container>

	<ng-template #notFound>
		<div class="page-card">
			<div class="alert alert-warning mb-0" role="alert">
				TblPropertyMaster Not Found
			</div>
		</div>
	</ng-template>

</div>
