<div class="container grid-page-shell">
	<!-- ============================================
		 Section 1: Caption
		 ============================================ -->
	<div class="page-header-bar-simple">
		<h1 class="page-caption">{{ actionType }} Menu Masters</h1>
	</div>

	<ng-container *ngIf="tblMenuMaster; else notFound">

		<form #form="ngForm" novalidate>

			<!-- ============================================
				 Section 2: Input fields
				 ============================================ -->
			<div class="page-card">

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldTableOrView">Table Or View</label>
						<input type="text" id="fldTableOrView" class="form-control" name="fldTableOrView" [(ngModel)]="tblMenuMaster.fldTableOrView" maxlength="1" required>
						<div class="text-danger" *ngIf="form.controls['fldTableOrView']?.touched && form.controls['fldTableOrView']?.invalid">
							Table Or View is required.
						</div>
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKCategory">F K Category</label>
						<select id="fldFKCategory" class="form-select" name="fldFKCategory" [(ngModel)]="tblMenuMaster.fldFKCategory" (change)="onSelectChange($event, 'fldCategory')" required>
							<option value="">-- Select --</option>
							<option *ngFor="let tblPropertyCategory of tblPropertyCategory$ | async" [value]="tblPropertyCategory.fldId"> {{ tblPropertyCategory.fldDescription }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKCategory']?.touched && form.controls['fldFKCategory']?.invalid">
							F K Category is required and should be greater than 0.
						</div>
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldCategory">Category</label>
						<input type="text" id="fldCategory" class="form-control" name="fldCategory" [(ngModel)]="tblMenuMaster.fldCategory" maxlength="50" required>
						<div class="text-danger" *ngIf="form.controls['fldCategory']?.touched && form.controls['fldCategory']?.invalid">
							Category is required.
						</div>
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldMenuName">Menu Name</label>
						<input type="text" id="fldMenuName" class="form-control" name="fldMenuName" [(ngModel)]="tblMenuMaster.fldMenuName" maxlength="50" required>
						<div class="text-danger" *ngIf="form.controls['fldMenuName']?.touched && form.controls['fldMenuName']?.invalid">
							Menu Name is required.
						</div>
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldTableOrViewName">Table Or View Name</label>
						<input type="text" id="fldTableOrViewName" class="form-control" name="fldTableOrViewName" [(ngModel)]="tblMenuMaster.fldTableOrViewName" maxlength="50" required>
						<div class="text-danger" *ngIf="form.controls['fldTableOrViewName']?.touched && form.controls['fldTableOrViewName']?.invalid">
							Table Or View Name is required.
						</div>
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldCondition">Condition</label>
						<input type="text" id="fldCondition" class="form-control" name="fldCondition" [(ngModel)]="tblMenuMaster.fldCondition" maxlength="50">
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldRoleOfTheMenu">Role Of The Menu</label>
						<input type="text" id="fldRoleOfTheMenu" class="form-control" name="fldRoleOfTheMenu" [(ngModel)]="tblMenuMaster.fldRoleOfTheMenu" maxlength="50">
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldControllerName">Controller Name</label>
						<input type="text" id="fldControllerName" class="form-control" name="fldControllerName" [(ngModel)]="tblMenuMaster.fldControllerName" maxlength="50">
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldIcon">Icon</label>
						<input type="text" id="fldIcon" class="form-control" name="fldIcon" [(ngModel)]="tblMenuMaster.fldIcon" maxlength="50">
					</div>
					<div class="col-3 field-group field-group-switch">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" id="fldIsProcessProgram" name="fldIsProcessProgram" [(ngModel)]="tblMenuMaster.fldIsProcessProgram">
							<label class="form-check-label" for="fldIsProcessProgram">Is Process Program</label>
						</div>
					</div>
				</div>

				<input id="fldId" name="fldId" [(ngModel)]="tblMenuMaster.fldId" hidden>
				<input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblMenuMaster.fldIsActive" hidden>
				<input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblMenuMaster.fldCreatedBy" hidden>
				<input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblMenuMaster.fldCreatedDt" hidden>

			</div>

			<!-- ============================================
				 Section 3: Command buttons
				 ============================================ -->
			<div class="page-actions-bar">
				<button type="button" (click)="submitAction = 'Edit'; OnFormSubmit(form)" class="btn-app btn-save" [disabled]="actionType !== 'Edit'">
					<i class="bi bi-floppy"></i>
					Save
				</button>
				<button type="button" (click)="submitAction = 'Delete'; OnFormSubmit(form)" class="btn-app btn-delete" [disabled]="actionType !== 'Delete'">
					<i class="bi bi-trash3"></i>
					Delete
				</button>
				<button type="button" (click)="backToHome()" class="btn-app btn-dark">
					<i class="bi bi-arrow-left"></i>
					Back
				</button>
			</div>

		</form>

	</ng-container>

	<ng-template #notFound>
		<div class="page-card">
			<div class="alert alert-warning mb-0" role="alert">
				TblMenuMaster Not Found
			</div>
		</div>
	</ng-template>

</div>
