<div class="container grid-page-shell">

    <!-- ============================================
         Section 1: Caption
         ============================================ -->
    <div class="page-header-bar-simple">
        <h1 class="page-caption">Add Properties</h1>
    </div>

    <!-- <form #form="ngForm" (ngSubmit)="OnFormSubmit(form)" novalidate> -->
    <<form #form="ngForm" novalidate>
        <!-- ============================================
             Section 2: Input fields
             ============================================ -->
        <div class="page-card">

            <div class="d-flex flex-row form-row">

                <div class="col-3 field-group">
                    <label class="form-label" for="fldFKProperty">Property Master</label>
                    <select id="fldFKProperty" class="form-select" name="fldFKProperty"
                        [(ngModel)]="model.fldFKProperty" required>
                        <option *ngFor="let tblPropertyMaster of tblPropertyMaster$ | async"
                            [value]="tblPropertyMaster.fldId"> {{ tblPropertyMaster.fldDescription }}
                        </option>
                    </select>
                </div>

                <div class="col-1 field-group">
                    <label class="form-label" for="fldSlNo">Sl No</label>
                    <input type="number" id="fldSlNo" class="form-control" name="fldSlNo" [(ngModel)]="model.fldSlNo"
                        step="1" min="1" required>

                    <div class="text-danger"
                        *ngIf="form.controls['fldSlNo']?.touched && form.controls['fldSlNo']?.invalid">

                        Sl No must be greater than zero.

                    </div>
                </div>

                <div class="col-6 field-group">
                    <label class="form-label" for="fldDescription">Description</label>
                    <input type="text" id="fldDescription" class="form-control" name="fldDescription"
                        [(ngModel)]="model.fldDescription" maxlength="100" required>

                    <div class="text-danger"
                        *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.invalid">

                        Description is required.

                    </div>
                </div>

            </div>
            <div class="d-flex flex-row form-row">

                <div class="col-3 field-group">
                    <label class="form-label" for="fldShortName">Short Name</label>
                    <input type="text" id="fldShortName" class="form-control" name="fldShortName"
                        [(ngModel)]="model.fldShortName" maxlength="30">
                </div>

                <div class="col-3 field-group field-group-switch">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="fldSetAsDefault" #fldSetAsDefault
                            [checked]="model.fldSetAsDefault"
                            (change)="model.fldSetAsDefault = fldSetAsDefault.checked">
                        <label class="form-check-label" for="fldSetAsDefault">Set As Default</label>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-row form-row">

            </div>
        </div>

        <!-- ============================================
             Section 3: Command buttons
             ============================================ -->
        <div class="page-actions-bar">
            <button 
                type="submit" 
                (click)="OnFormSubmit(form, 'SaveAndAddNew')"
                class="btn-app btn-save">
                <!-- [disabled]="form.invalid"> -->
                <i class="bi bi-floppy"></i>
                Save &amp; Add New
            </button>
            <button 
            type="submit" (click)="OnFormSubmit(form, 'SaveAndClose')" class="btn-app btn-new">
                <!-- [disabled]="form.invalid"> -->
                <i class="bi bi-check2-circle"></i>
                Save &amp; Close
            </button>
            <button type="button" (click)="backToHome()" class="btn-app btn-dark">
                <i class="bi bi-arrow-left"></i>
                Back
            </button>
        </div>

    </form>

</div>
