<div class="container grid-page-shell">
	<!-- ============================================
		 Section 1: Caption
		 ============================================ -->
	<div class="page-header-bar-simple">
		<h1 class="page-caption">{{ actionType }} Area Masters</h1>
	</div>

	<ng-container *ngIf="tblAreaMaster; else notFound">

		<form #form="ngForm" novalidate>

			<!-- ============================================
				 Section 2: Input fields
				 ============================================ -->
			<div class="page-card">

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKState">State</label>
						<select id="fldFKState" class="form-select" name="fldFKState" [(ngModel)]="tblAreaMaster.fldFKState" required>
							<option value="">-- Select --</option>
							<option *ngFor="let tblStateMaster of tblStateMaster$ | async" [value]="tblStateMaster.fldId"> {{ tblStateMaster.fldStateName }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKState']?.touched && form.controls['fldFKState']?.invalid">
							F K State is required and should be greater than 0.
						</div>
					
						<input type="text" id="fldState" class="form-control" name="fldState" [(ngModel)]="tblAreaMaster.fldState" maxlength="50" hidden>
					</div>
				<!-- </div>

				<div class="d-flex flex-row form-row"> -->
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKCity">City</label>
						<select id="fldFKCity" class="form-select" name="fldFKCity" [(ngModel)]="tblAreaMaster.fldFKCity" (change)="onSelectChange($event, 'fldCity')" required>
							<option value="">-- Select --</option>
							<option *ngFor="let tblPropertyCity of tblPropertyCity$ | async" [value]="tblPropertyCity.fldId"> {{ tblPropertyCity.fldDescription }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKCity']?.touched && form.controls['fldFKCity']?.invalid">
							F K City is required and should be greater than 0.
						</div>
					
						<input type="text" id="fldCity" class="form-control" name="fldCity" [(ngModel)]="tblAreaMaster.fldCity" maxlength="50" hidden>
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKArea">Area</label>
						<select id="fldFKArea" class="form-select" name="fldFKArea" [(ngModel)]="tblAreaMaster.fldFKArea" (change)="onSelectChange($event, 'fldArea')" required>
							<option value="">-- Select --</option>
							<option *ngFor="let tblPropertyArea of tblPropertyArea$ | async" [value]="tblPropertyArea.fldId"> {{ tblPropertyArea.fldDescription }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKArea']?.touched && form.controls['fldFKArea']?.invalid">
							F K Area is required and should be greater than 0.
						</div>
					
						<input type="text" id="fldArea" class="form-control" name="fldArea" [(ngModel)]="tblAreaMaster.fldArea" maxlength="50" hidden>
					</div>
				<!-- </div>

				<div class="d-flex flex-row form-row"> -->
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKPincode">Pincode</label>
						<select id="fldFKPincode" class="form-select" name="fldFKPincode" [(ngModel)]="tblAreaMaster.fldFKPincode" (change)="onSelectChange($event, 'fldPincode')" required>
							<option value="">-- Select --</option>
							<option *ngFor="let tblPropertyPincode of tblPropertyPincode$ | async" [value]="tblPropertyPincode.fldId"> {{ tblPropertyPincode.fldDescription }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKPincode']?.touched && form.controls['fldFKPincode']?.invalid">
							F K Pincode is required and should be greater than 0.
						</div>

						<input type="text" id="fldPincode" class="form-control" name="fldPincode" [(ngModel)]="tblAreaMaster.fldPincode" maxlength="50" hidden>
					</div>
					
				</div>

				

				<input id="fldId" name="fldId" [(ngModel)]="tblAreaMaster.fldId" hidden>
				<input type="number" id="fldStateCode" class="form-control" name="fldStateCode" [(ngModel)]="tblAreaMaster.fldStateCode" step="1" min="0" hidden>
						<input type="text" id="fldStateShortCode" class="form-control" name="fldStateShortCode" [(ngModel)]="tblAreaMaster.fldStateShortCode" maxlength="5" hidden>
				<input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblAreaMaster.fldIsActive" hidden>
				<input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblAreaMaster.fldCreatedBy" hidden>
				<input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblAreaMaster.fldCreatedDt" hidden>

			</div>

			<!-- ============================================
				 Section 3: Command buttons
				 ============================================ -->
			<div class="page-actions-bar">
				<button type="button" (click)="submitAction = 'Edit'; OnFormSubmit(form)" class="btn-app btn-save" [disabled]="actionType !== 'Edit'">
					<i class="bi bi-floppy"></i>
					Save
				</button>
				<button type="button" (click)="submitAction = 'Delete'; OnFormSubmit(form)" class="btn-app btn-delete" [disabled]="actionType !== 'Delete'">
					<i class="bi bi-trash3"></i>
					Delete
				</button>
				<button type="button" (click)="backToHome()" class="btn-app btn-dark">
					<i class="bi bi-arrow-left"></i>
					Back
				</button>
			</div>

		</form>

	</ng-container>

	<ng-template #notFound>
		<div class="page-card">
			<div class="alert alert-warning mb-0" role="alert">
				TblAreaMaster Not Found
			</div>
		</div>
	</ng-template>

</div>
